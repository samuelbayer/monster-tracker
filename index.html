<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Monster Vault</title>
<meta name="description" content="Vuestro registro de sabores de Monster: puntúa lo que probáis y consúltalo antes de entrar a la tienda.">
<meta name="theme-color" content="#0a0c08">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Monster Vault">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c08;
    --panel: #14180f;
    --panel-2: #0e110b;
    --panel-edge: #262d1b;
    --acid: #95d600;
    --acid-dim: #6fa300;
    --ink: #eef2e6;
    --muted: #9aa38b;
    --danger: #ff5a4d;
    --amber: #ffb800;
    --shadow: 0 12px 40px rgba(0,0,0,.55);
    --radius: 16px;
    --gutter: 20px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background:
      radial-gradient(900px 500px at 80% -10%, rgba(149,214,0,.10), transparent 60%),
      radial-gradient(700px 400px at -10% 110%, rgba(149,214,0,.06), transparent 55%),
      var(--bg);
    background-attachment: fixed;
    color: var(--ink);
    min-height: 100vh;
    padding: 32px var(--gutter) calc(48px + env(safe-area-inset-bottom));
    -webkit-tap-highlight-color: transparent;
  }
  body.sheet-open { overflow: hidden; }

  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--acid); outline-offset: 2px; }
  input:focus-visible { outline: none; }

  .icon { width: 18px; height: 18px; flex-shrink: 0; display: block; }

  .wrap { max-width: 1100px; margin: 0 auto; }

  /* ---------- Cabecera ---------- */
  header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
    padding-bottom: 24px;
  }
  .brand h1 {
    font-family: 'Anton', sans-serif;
    font-weight: 400;
    font-size: clamp(40px, 7vw, 72px);
    line-height: .92;
    letter-spacing: .5px;
    text-transform: uppercase;
  }
  .brand h1 .claw { color: var(--acid); text-shadow: 0 0 24px rgba(149,214,0,.45); }
  .brand p { color: var(--muted); margin-top: 10px; font-size: 14px; max-width: 40ch; line-height: 1.45; }

  /* Las estadísticas son también los filtros */
  .stats { display: flex; gap: 6px; flex-shrink: 0; }
  .stat {
    background: none;
    border: 1px solid transparent;
    border-radius: 12px;
    padding: 8px 12px;
    text-align: left;
    transition: background .15s ease, border-color .15s ease;
  }
  .stat:hover { background: rgba(255,255,255,.03); }
  .stat .n { display: block; font-family: 'Anton', sans-serif; font-size: 44px; line-height: 1; color: var(--ink); }
  .stat .lbl {
    display: block;
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.8px;
    margin-top: 6px;
  }
  .stat.accent .n { color: var(--acid); }
  .stat[aria-pressed="true"] { background: var(--panel); border-color: var(--panel-edge); }
  .stat[aria-pressed="true"] .lbl { color: var(--ink); }

  /* ---------- Barra fija (buscador, orden, añadir) ---------- */
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 20;
    margin: 0 calc(-1 * var(--gutter)) 24px;
    padding: 12px var(--gutter);
    background: rgba(10,12,8,.82);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    border-bottom: 1px solid var(--panel-edge);
  }
  .toolbar-row { max-width: 1100px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }

  .search-box { position: relative; flex: 1; min-width: 0; }
  .search-box .icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .search {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 12px;
    padding: 12px 40px 12px 42px;
    font-size: 16px; /* 16px: evita el zoom automático de iPhone al enfocar */
    transition: border-color .15s ease;
    -webkit-appearance: none;
    appearance: none;
  }
  .search::-webkit-search-cancel-button { -webkit-appearance: none; }
  .search::placeholder { color: var(--muted); }
  .search:focus { outline: none; border-color: var(--acid-dim); }
  .search-clear {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    width: 32px; height: 32px; border-radius: 8px;
    border: none; background: none; color: var(--muted);
    display: flex; align-items: center; justify-content: center;
  }
  .search-clear:hover { color: var(--ink); }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    height: 46px;
    padding: 0 18px;
    border-radius: 12px;
    font-weight: 600;
    font-size: 14px;
    white-space: nowrap;
    border: 1px solid var(--panel-edge);
    background: var(--panel);
    color: var(--muted);
    transition: color .15s ease, border-color .15s ease, background .15s ease, transform .12s ease, box-shadow .2s ease;
  }
  .btn:hover { color: var(--ink); border-color: var(--muted); }
  .btn.active { color: var(--ink); border-color: var(--acid-dim); }
  .btn.active .icon { color: var(--acid); }
  .btn-add { background: var(--acid); border-color: var(--acid); color: #0a0c08; font-weight: 700; }
  .btn-add:hover { color: #0a0c08; border-color: var(--acid); transform: translateY(-1px); box-shadow: 0 8px 28px rgba(149,214,0,.3); }

  .filter-chip {
    max-width: 1100px;
    margin: 10px auto 0;
    display: flex;
  }
  .filter-chip button {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(149,214,0,.12);
    border: 1px solid rgba(149,214,0,.35);
    color: var(--ink);
    border-radius: 999px;
    padding: 5px 8px 5px 12px;
    font-size: 13px; font-weight: 600;
  }
  .filter-chip .icon { width: 14px; height: 14px; color: var(--muted); }

  /* Botón flotante (solo móvil) */
  .fab {
    display: none;
    position: fixed;
    right: 16px;
    bottom: calc(16px + env(safe-area-inset-bottom));
    width: 58px; height: 58px;
    border-radius: 18px;
    border: none;
    background: var(--acid);
    color: #0a0c08;
    align-items: center; justify-content: center;
    box-shadow: 0 10px 30px rgba(0,0,0,.5), 0 0 0 1px rgba(0,0,0,.2);
    z-index: 30;
    transition: transform .12s ease;
  }
  .fab:active { transform: scale(.94); }
  .fab .icon { width: 26px; height: 26px; }

  /* ---------- Rejilla y tarjetas ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
  }

  .card {
    /* Colores de la lata: los calcula el JS a partir de la imagen */
    --tint-a: hsl(80 6% 92%);
    --tint-b: hsl(80 6% 80%);
    --tint-c: var(--muted);
    position: relative;
    display: block;
    width: 100%;
    text-align: left;
    padding: 0;
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    transition: transform .18s ease, border-color .2s ease, box-shadow .2s ease;
  }
  .grid.intro .card { animation: card-in .35s ease both; }
  @keyframes card-in { from { opacity: 0; transform: translateY(6px); } }
  .card:hover {
    transform: translateY(-4px);
    border-color: var(--tint-c);
    box-shadow: var(--shadow), 0 10px 40px -12px var(--tint-c);
  }
  .card:active { transform: translateY(-1px) scale(.99); }

  .card-img {
    position: relative;
    aspect-ratio: 400 / 460;
    background: radial-gradient(110% 80% at 50% 62%, var(--tint-b), var(--tint-a) 72%);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  /* multiply: el blanco de la foto se funde con el color de la tarjeta */
  .card-img img {
    width: 100%; height: 100%;
    object-fit: contain;
    mix-blend-mode: multiply;
    transition: transform .3s ease;
  }
  .card:hover .card-img img { transform: scale(1.04) rotate(-1deg); }
  .card-img .placeholder { color: rgba(0,0,0,.22); }
  .card-img .placeholder .icon { width: 48px; height: 48px; }

  .score-badge {
    position: absolute;
    top: 10px; left: 10px;
    min-width: 44px; height: 44px;
    padding: 0 8px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Anton', sans-serif;
    font-size: 24px;
    line-height: 1;
    box-shadow: 0 4px 14px rgba(0,0,0,.28);
    z-index: 1;
  }
  .score-badge.high { background: var(--acid); color: #0a0c08; }
  .score-badge.mid { background: var(--amber); color: #1d1500; }
  .score-badge.low { background: var(--danger); color: #fff; }

  .card-body { display: block; padding: 14px 16px 16px; }
  .card-name {
    font-weight: 700;
    font-size: 15px;
    line-height: 1.3;
    min-height: calc(2 * 1.3em);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 10px;
  }
  .card-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 22px; }
  .line-tag {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 11px; font-weight: 600;
    letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--muted);
  }
  .line-tag i { width: 8px; height: 8px; border-radius: 50%; background: var(--tint-c); box-shadow: 0 0 8px var(--tint-c); }
  .todo {
    font-size: 11px; font-weight: 600;
    color: var(--muted);
    border: 1px dashed var(--panel-edge);
    padding: 3px 8px;
    border-radius: 999px;
    white-space: nowrap;
  }

  .empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 72px 20px;
    border: 1px dashed var(--panel-edge);
    border-radius: var(--radius);
    color: var(--muted);
  }
  .empty .icon { width: 36px; height: 36px; margin: 0 auto 14px; color: var(--panel-edge); }
  .empty .big { font-family: 'Anton', sans-serif; font-size: 26px; color: var(--ink); margin-bottom: 6px; text-transform: uppercase; }

  /* ---------- Hoja inferior (añadir / editar) ---------- */
  .backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.62);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: 0; pointer-events: none;
    transition: opacity .25s ease;
    z-index: 50;
  }
  .backdrop.open { opacity: 1; pointer-events: auto; }

  .sheet {
    position: fixed;
    left: 50%; bottom: 0;
    width: 100%; max-width: 620px;
    max-height: 92vh; max-height: 92dvh;
    overflow-y: auto;
    overscroll-behavior: contain;
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-bottom: none;
    border-radius: 22px 22px 0 0;
    padding: 12px 24px calc(24px + env(safe-area-inset-bottom));
    box-shadow: 0 -12px 40px rgba(0,0,0,.6);
    transform: translate(-50%, 105%);
    transition: transform .32s cubic-bezier(.2,.8,.2,1);
    z-index: 51;
  }
  .sheet.open { transform: translate(-50%, 0); }
  .sheet-handle { width: 40px; height: 4px; border-radius: 2px; background: var(--panel-edge); margin: 0 auto 16px; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  .sheet-title { font-family: 'Anton', sans-serif; font-weight: 400; font-size: 24px; letter-spacing: .5px; text-transform: uppercase; }
  .icon-btn {
    width: 38px; height: 38px;
    border-radius: 10px;
    border: 1px solid var(--panel-edge);
    background: var(--panel-2);
    color: var(--muted);
    display: inline-flex; align-items: center; justify-content: center;
    transition: color .15s ease, border-color .15s ease;
  }
  .icon-btn:hover { color: var(--ink); border-color: var(--muted); }

  .field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
  .field-label {
    font-size: 12px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 1.5px;
    color: var(--muted);
  }
  .input {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--panel-edge);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 16px; /* 16px evita el zoom automático en iPhone */
    transition: border-color .15s ease;
  }
  .input::placeholder { color: #6c7460; }
  .input:focus { outline: none; border-color: var(--acid-dim); }

  .img-field { display: flex; gap: 14px; align-items: stretch; }
  .img-preview {
    position: relative;
    width: 104px;
    aspect-ratio: 400 / 460;
    flex-shrink: 0;
    border-radius: 12px;
    overflow: hidden;
    border: 1px dashed var(--panel-edge);
    background: var(--panel-2);
    display: flex; align-items: center; justify-content: center;
    color: var(--panel-edge);
  }
  .img-preview.has-img { border-style: solid; background: #fff; }
  .img-preview img { width: 100%; height: 100%; object-fit: contain; }
  .img-preview .icon { width: 30px; height: 30px; }
  .img-clear {
    position: absolute; top: 6px; right: 6px;
    width: 28px; height: 28px;
    border-radius: 8px; border: none;
    background: rgba(10,12,8,.8); color: #fff;
    display: flex; align-items: center; justify-content: center;
  }
  .img-clear .icon { width: 15px; height: 15px; }
  .img-inputs { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; justify-content: center; }
  .upload-btn { height: 46px; width: 100%; background: var(--panel-2); color: var(--ink); }
  .url-box { position: relative; }
  .url-box .icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); pointer-events: none; }
  .url-box .input { padding-left: 38px; }

  .rating-row { display: grid; grid-template-columns: repeat(11, 1fr); gap: 6px; }
  .rating-row .dot {
    height: 42px;
    border-radius: 10px;
    border: 1px solid var(--panel-edge);
    background: var(--panel-2);
    color: var(--muted);
    font-weight: 700;
    font-size: 15px;
    transition: background .12s ease, color .12s ease, border-color .12s ease, transform .1s ease;
  }
  .rating-row .dot:hover { border-color: var(--muted); color: var(--ink); }
  .rating-row .dot:active { transform: scale(.94); }
  .rating-row .dot.active.high { background: var(--acid); border-color: var(--acid); color: #0a0c08; }
  .rating-row .dot.active.mid { background: var(--amber); border-color: var(--amber); color: #1d1500; }
  .rating-row .dot.active.low { background: var(--danger); border-color: var(--danger); color: #fff; }
  .rating-hint { font-size: 12px; color: var(--muted); }

  .sheet-actions { display: flex; gap: 10px; margin-top: 8px; align-items: center; }
  .btn-primary {
    height: 48px; padding: 0 28px;
    border-radius: 12px; border: none;
    background: var(--acid); color: #0a0c08;
    font-weight: 700; font-size: 15px;
    transition: transform .12s ease, box-shadow .2s ease;
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(149,214,0,.25); }
  .btn-ghost {
    height: 48px; padding: 0 22px;
    border-radius: 12px;
    border: 1px solid var(--panel-edge);
    background: transparent; color: var(--muted);
    font-weight: 600; font-size: 15px;
  }
  .btn-ghost:hover { color: var(--ink); border-color: var(--muted); }
  .btn-delete {
    margin-left: auto;
    height: 48px; padding: 0 14px;
    border-radius: 12px; border: 1px solid transparent;
    background: none; color: var(--danger);
    display: inline-flex; align-items: center; gap: 8px;
    font-weight: 600; font-size: 14px;
  }
  .btn-delete:hover { border-color: rgba(255,90,77,.4); background: rgba(255,90,77,.08); }
  .btn-danger {
    height: 46px; padding: 0 22px;
    border-radius: 12px; border: none;
    background: var(--danger); color: #fff;
    font-weight: 700; font-size: 15px;
  }

  /* ---------- Diálogo de confirmación ---------- */
  #confirmBackdrop { z-index: 60; }
  .confirm {
    position: fixed; left: 50%; top: 50%;
    width: min(380px, calc(100% - 32px));
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 18px;
    padding: 24px;
    box-shadow: var(--shadow);
    transform: translate(-50%, -50%) scale(.96);
    opacity: 0; pointer-events: none;
    transition: opacity .18s ease, transform .18s ease;
    z-index: 61;
  }
  .confirm.open { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
  .confirm-title { font-weight: 700; font-size: 18px; margin-bottom: 8px; }
  .confirm-text { color: var(--muted); font-size: 14px; line-height: 1.5; margin-bottom: 22px; }
  .confirm .sheet-actions { margin-top: 0; }

  /* ---------- Avisos ---------- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(24px + env(safe-area-inset-bottom));
    transform: translate(-50%, 20px);
    display: flex; align-items: center; gap: 12px;
    max-width: calc(100% - 32px);
    background: #f2f5ec;
    color: #0a0c08;
    border-radius: 14px;
    padding: 12px 12px 12px 16px;
    font-size: 14px; font-weight: 600;
    box-shadow: 0 12px 30px rgba(0,0,0,.45);
    opacity: 0; pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
    z-index: 70;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .toast .icon { color: var(--acid-dim); }
  .toast button {
    background: #0a0c08; color: #fff;
    border: none; border-radius: 9px;
    padding: 7px 12px; font-size: 13px; font-weight: 700;
  }
  .toast button[hidden] { display: none; }

  /* ---------- Pie ---------- */
  footer {
    margin-top: 48px;
    padding-top: 20px;
    border-top: 1px solid var(--panel-edge);
    display: flex; flex-wrap: wrap; gap: 12px 20px;
    align-items: center; justify-content: space-between;
    color: var(--muted);
    font-size: 13px;
  }
  .footer-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .link-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: none; border: 1px solid var(--panel-edge);
    color: var(--muted);
    border-radius: 9px; padding: 7px 12px;
    font-size: 13px; font-weight: 600;
  }
  .link-btn:hover { color: var(--ink); border-color: var(--muted); }
  .link-btn .icon { width: 15px; height: 15px; }

  /* ---------- Móvil ---------- */
  @media (max-width: 560px) {
    :root { --gutter: 16px; }
    body { padding-top: 24px; padding-bottom: calc(100px + env(safe-area-inset-bottom)); }
    header { gap: 16px; padding-bottom: 16px; }
    .stats { width: 100%; justify-content: space-between; margin: 0 -12px; width: calc(100% + 24px); }
    .stat .n { font-size: 32px; }
    .stat .lbl { font-size: 10px; letter-spacing: 1.4px; }
    .toolbar { margin-bottom: 16px; padding-top: 10px; padding-bottom: 10px; }
    .btn-add { display: none; }
    .btn-sort .label { display: none; }
    .btn-sort { width: 46px; padding: 0; }
    .fab { display: flex; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .card { border-radius: 14px; }
    .card-body { padding: 10px 12px 12px; }
    .card-name { font-size: 14px; margin-bottom: 8px; }
    .line-tag { font-size: 10px; letter-spacing: 1px; gap: 6px; }
    .todo { font-size: 10px; padding: 2px 7px; }
    .score-badge { top: 8px; left: 8px; min-width: 36px; height: 36px; font-size: 20px; border-radius: 10px; }
    .sheet { padding-left: 18px; padding-right: 18px; }
    .rating-row { grid-template-columns: repeat(6, 1fr); gap: 8px; }
    .rating-row .dot { height: 46px; }
    .btn-delete .label { display: none; }
    .toast { bottom: calc(90px + env(safe-area-inset-bottom)); }
    footer { flex-direction: column; align-items: flex-start; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>Monster <span class="claw">Vault</span></h1>
      <p>Vuestro registro de sabores. Puntúa lo que probáis y consúltalo antes de entrar a la tienda.</p>
    </div>
    <div class="stats" id="stats" role="group" aria-label="Filtrar sabores"></div>
  </header>
</div>

<div class="toolbar">
  <div class="toolbar-row">
    <div class="search-box">

  // ---------- Persistencia ----------
  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const data = raw ? JSON.parse(raw) : [];
      return Array.isArray(data) ? data : [];
    } catch (e) {
      return [];
    }
  }
  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(flavors));
  }
  function getPref(key) {
    try { return localStorage.getItem(STORAGE_KEY + '-' + key); } catch (e) { return null; }
  }
  function setPref(key, value) {
    try { localStorage.setItem(STORAGE_KEY + '-' + key, value); } catch (e) {}
  }

  // ---------- Estado ----------
  let flavors = load();
  let editingId = null;
  let selectedScore = null;
  let sortByScore = getPref('sort') === 'true';
  let filter = 'all';          // 'all' | 'fav' | 'todo'
  let searchTerms = [];

  // ---------- Catálogo ----------
  // Añade los sabores del catálogo que aún no se hayan sembrado nunca. Cada slug
  // se marca como sembrado, así un sabor que borres no vuelve a aparecer.
  const SEEDED_KEY = STORAGE_KEY + '-seeded';
  function readSeeded() {
    try { return JSON.parse(localStorage.getItem(SEEDED_KEY) || '[]'); } catch (e) { return []; }
  }
  (function seedCatalog() {
    const seeded = readSeeded();
    const existing = new Set(flavors.map(f => String(f.name).trim().toLowerCase()));
    const nuevos = [];
    const marcados = [...seeded];
    MONSTER_CATALOG.forEach(c => {
      if (seeded.includes(c.slug)) return;
      marcados.push(c.slug);
      if (existing.has(c.name.toLowerCase())) return; // ya lo tenías a mano
      nuevos.push({ id: 'seed-' + c.slug, name: c.name, img: c.img, score: null });
    });
    if (marcados.length === seeded.length) return;
    const antes = flavors;
    flavors = flavors.concat(nuevos);
    try {
      save();
      localStorage.setItem(SEEDED_KEY, JSON.stringify(marcados));
    } catch (e) {
      flavors = antes; // sin espacio: no siembra y lo reintenta la próxima vez
    }
  })();

  // Sustituye las imágenes antiguas del catálogo por las normalizadas, solo si
  // siguen siendo las originales (no toca fotos que hayáis cambiado vosotros).
  (function upgradeCatalogImages() {
    if (Number(getPref('img-rev')) >= CATALOG_IMG_REV) return;
    const bySlug = new Map(MONSTER_CATALOG.map(c => [c.slug, c]));
    let changed = false;
    flavors.forEach(f => {
      const slug = String(f.id).startsWith('seed-') ? String(f.id).slice(5) : null;
      const c = slug && bySlug.get(slug);
      if (c && f.img && f.img.length === OLD_IMG_LEN[slug]) { f.img = c.img; changed = true; }
    });
    try {
      if (changed) save();
      setPref('img-rev', CATALOG_IMG_REV);
    } catch (e) { /* sin espacio: se reintenta la próxima vez */ }
  })();

  // ---------- Utilidades ----------
  const hasScore = f => f.score !== null && f.score !== undefined;
  const tierOf = s => s >= 8 ? 'high' : s >= 5 ? 'mid' : 'low';
  const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function lineOf(name) {
    const n = String(name).toLowerCase();
    if (n.includes('rehab')) return 'Rehab';
    if (n.includes('juice')) return 'Juiced';
    if (n.includes('ultra')) return 'Ultra';
    if (n.includes('reserve')) return 'Reserve';
    return 'Monster';
  }

  // ---------- Avisos ----------
  let toastTimer = null;
  function toast(text, action) {
    $('toastText').textContent = text;
    const btn = $('toastAction');
    btn.hidden = !action;
    btn.onclick = action ? () => { hideToast(); action(); } : null;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, action ? 5000 : 2200);
  }
  function hideToast() { toastEl.classList.remove('show'); }

  // ---------- Confirmación genérica ----------
  let confirmCb = null;
  let confirmReturnFocus = null;
  function askConfirm({ title, text, ok }, cb) {
    confirmCb = cb;
    confirmReturnFocus = document.activeElement;
    $('confirmTitle').textContent = title;
    $('confirmText').textContent = text;
    $('confirmYes').textContent = ok;
    confirmBox.classList.add('open');
    confirmBackdrop.classList.add('open');
    $('confirmNo').focus();
  }
  function closeConfirm() {
    confirmCb = null;
    confirmBox.classList.remove('open');
    confirmBackdrop.classList.remove('open');
    if (confirmReturnFocus) confirmReturnFocus.focus();
  }
  $('confirmYes').addEventListener('click', () => { const cb = confirmCb; closeConfirm(); if (cb) cb(); });
  $('confirmNo').addEventListener('click', closeConfirm);
  confirmBackdrop.addEventListener('click', closeConfirm);

  // ---------- Selector de puntuación ----------
  function paintRating() {
    [...ratingRow.children].forEach((d, i) => {
      const on = i === selectedScore;
      d.className = 'dot' + (on ? ' active ' + tierOf(i) : '');
      d.setAttribute('aria-checked', on ? 'true' : 'false');
    });
  }
  for (let i = 0; i <= 10; i++) {
    const dot = document.createElement('button');
    dot.type = 'button';
    dot.textContent = i;
    dot.setAttribute('role', 'radio');
    dot.addEventListener('click', () => {
      selectedScore = selectedScore === i ? null : i; // tocar la marcada la quita
      paintRating();
    });
    ratingRow.appendChild(dot);
  }

    imgPlaceholder.style.display = has ? 'none' : '';
    clearImgBtn.hidden = !has;
    if (has) imgPreviewImg.src = currentImg;
    else imgPreviewImg.removeAttribute('src');
  }

  // Redimensiona a máx. 400px de ancho y devuelve JPEG en base64 (calidad 0.8)
  function resizeImage(file, maxW, cb) {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff'; // PNG transparentes: fondo blanco para que se funda con la tarjeta
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        cb(canvas.toDataURL('image/jpeg', 0.8));
      };
      img.onerror = () => cb('');
      img.src = e.target.result;
    };
    reader.onerror = () => cb('');
    reader.readAsDataURL(file);
  }

  $('uploadBtn').addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if (!file) return;
    resizeImage(file, 400, dataUrl => {
      if (!dataUrl) { toast('No se pudo leer esa imagen'); return; }
      setPreview(dataUrl);
      imgInput.value = ''; // la foto subida tiene prioridad sobre la URL
    });
  });
  imgInput.addEventListener('input', () => {
    const v = imgInput.value.trim();
    if (v) setPreview(v);
    else if (!fileInput.files.length) setPreview('');
  });
  clearImgBtn.addEventListener('click', () => {
    setPreview('');
    imgInput.value = '';
    fileInput.value = '';
  });

  // ---------- Hoja ----------
  let resetTimer = null;
  let sheetReturnFocus = null;

  function openSheet(edit) {
    clearTimeout(resetTimer);
    sheetReturnFocus = document.activeElement;
    sheet.scrollTop = 0;
    sheet.classList.add('open');
    sheetBackdrop.classList.add('open');
    document.body.classList.add('sheet-open');
    if (!edit) setTimeout(() => nameInput.focus(), 320);
    else setTimeout(() => $('sheetClose').focus({ preventScroll: true }), 320);
  }
  function closeSheet() {
    sheet.classList.remove('open');
    sheetBackdrop.classList.remove('open');
    document.body.classList.remove('sheet-open');
    clearTimeout(resetTimer);
    resetTimer = setTimeout(resetForm, 320); // cuando ya ha bajado, para que no parpadee
    if (sheetReturnFocus) sheetReturnFocus.focus({ preventScroll: true });
  }
  function resetForm() {
    editingId = null;
    selectedScore = null;
    nameInput.value = '';
    imgInput.value = '';
    fileInput.value = '';
    setPreview('');
    sheetTitle.textContent = 'Nuevo sabor';
    saveBtn.textContent = 'Guardar';
    deleteBtn.hidden = true;
    paintRating();
  }
  function startAdd() {
    clearTimeout(resetTimer);
    resetForm();
    openSheet(false);
  }
  function startEdit(id) {
    const f = flavors.find(x => x.id === id);
    if (!f) return;
    clearTimeout(resetTimer);
    editingId = id;
    nameInput.value = f.name;
    // Una URL se muestra en el campo; una foto subida (base64) solo en la vista previa
    imgInput.value = (f.img && !f.img.startsWith('data:')) ? f.img : '';
    fileInput.value = '';
    setPreview(f.img || '');
    selectedScore = hasScore(f) ? f.score : null;
    paintRating();
    sheetTitle.textContent = 'Editar sabor';
    saveBtn.textContent = 'Guardar';
    deleteBtn.hidden = false;
    openSheet(true);
  }

  $('addBtn').addEventListener('click', startAdd);
  $('fab').addEventListener('click', startAdd);
  $('cancelBtn').addEventListener('click', closeSheet);
  $('sheetClose').addEventListener('click', closeSheet);
  sheetBackdrop.addEventListener('click', closeSheet);
  nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') saveBtn.click(); });

  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (confirmBox.classList.contains('open')) closeConfirm();
    else if (sheet.classList.contains('open')) closeSheet();
  });

  // ---------- Guardar ----------
  saveBtn.addEventListener('click', () => {
    const name = nameInput.value.trim();
    if (!name) {
      nameInput.focus();
      nameInput.style.borderColor = 'var(--danger)';
      setTimeout(() => { nameInput.style.borderColor = ''; }, 1200);
      return;
    }
    const data = { name, img: currentImg, score: selectedScore };
    const snapshot = JSON.stringify(flavors);
    const isEdit = !!editingId;
    if (isEdit) {
      const idx = flavors.findIndex(f => f.id === editingId);
      if (idx !== -1) flavors[idx] = { ...flavors[idx], ...data };
    } else {
      flavors.unshift({ id: Date.now().toString(36), ...data });
    }
    try {
      save();
    } catch (e) {
      flavors = JSON.parse(snapshot);
      toast('Sin espacio: usa una imagen más ligera o borra algún sabor');
      return;
    }
    render();
    closeSheet();
    toast(isEdit ? 'Cambios guardados' : 'Sabor añadido');
  });

  // ---------- Borrar (con confirmación y deshacer) ----------
  deleteBtn.addEventListener('click', () => {
    const f = flavors.find(x => x.id === editingId);
    if (!f) return;
    askConfirm({
      title: '¿Borrar sabor?',
      text: `«${f.name}» se borrará junto con su puntuación.`,
      ok: 'Borrar'
    }, () => {
      const idx = flavors.findIndex(x => x.id === f.id);
      flavors.splice(idx, 1);
      save();
      closeSheet();
      render();
      toast('Sabor borrado', () => {
        flavors.splice(Math.min(idx, flavors.length), 0, f);
        save();
        render();
      });
    });
  });

  // ---------- Buscador, filtros y orden ----------
  searchInput.addEventListener('input', () => {
    searchTerms = norm(searchInput.value).split(/\s+/).filter(Boolean);
    searchClear.hidden = !searchInput.value;
    render();
  });
  searchClear.addEventListener('click', () => {
    searchInput.value = '';
    searchTerms = [];
    searchClear.hidden = true;
    searchInput.focus();
    render();
  });
  searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') searchInput.blur(); });

  sortToggle.addEventListener('click', () => {
    sortByScore = !sortByScore;
    setPref('sort', sortByScore);
    render();
  });

  const FILTERS = {
    all: { label: 'sabores', test: () => true },
    fav: { label: 'favoritos', chip: 'Favoritos (8 o más)', test: f => hasScore(f) && f.score >= 8 },
    todo: { label: 'por probar', chip: 'Por probar', test: f => !hasScore(f) }
  };
  function setFilter(key) {
    filter = (filter === key || key === 'all') ? 'all' : key;
    render();
    window.scrollTo({ top: Math.min(window.scrollY, grid.offsetTop - 140), behavior: 'smooth' });
  }
  $('filterChipBtn').addEventListener('click', () => setFilter('all'));

  // ---------- Copia de seguridad ----------
  $('exportBtn').addEventListener('click', () => {
    const data = { app: 'monster-vault', version: 1, exportedAt: new Date().toISOString(), seeded: readSeeded(), flavors };
    const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `monster-vault-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast('Copia exportada');
  });
  $('importBtn').addEventListener('click', () => $('importFile').click());
  $('importFile').addEventListener('change', () => {
    const file = $('importFile').files[0];
    $('importFile').value = '';
    if (!file) return;
    file.text().then(txt => {
      let data;
      try { data = JSON.parse(txt); } catch (e) { data = null; }
      const list = data && Array.isArray(data.flavors) ? data.flavors : null;
      const valid = list && list.every(f => f && typeof f.name === 'string' && f.id);
      if (!valid) { toast('Ese archivo no es una copia de Monster Vault'); return; }
      askConfirm({
        title: '¿Importar copia?',
        text: `Se reemplazará tu lista actual (${flavors.length} sabores) por la de la copia (${list.length} sabores).`,
        ok: 'Importar'
      }, () => {
        const before = flavors;
        flavors = list;
        try {
          save();
          if (Array.isArray(data.seeded)) localStorage.setItem(SEEDED_KEY, JSON.stringify(data.seeded));
        } catch (e) {
          flavors = before;
          toast('No hay espacio para importar esa copia');
          return;
        }
        filter = 'all';
        render();
        toast('Copia importada');
      });
    });
  });

  // ---------- Color de cada lata ----------
  // Tono dominante de la imagen (media circular de los píxeles con color). null si
  // la lata no tiene color o la imagen es de otro dominio sin CORS.
  const tintCache = new Map();
  function computeHue(img) {
    try {
      const c = document.createElement('canvas');
      const w = c.width = 40, h = c.height = 46;
      const ctx = c.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(img, 0, 0, w, h);
      const d = ctx.getImageData(0, 0, w, h).data;
      let x = 0, y = 0, n = 0;
      for (let i = 0; i < d.length; i += 4) {
        const r = d[i] / 255, g = d[i + 1] / 255, b = d[i + 2] / 255;
        const max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2;
        if (max === min) continue;
        const sat = (max - min) / (1 - Math.abs(2 * l - 1));
        if (sat < .4 || l < .15 || l > .88) continue;
        let hue;
        if (max === r) hue = ((g - b) / (max - min) + 6) % 6;
        else if (max === g) hue = (b - r) / (max - min) + 2;
        else hue = (r - g) / (max - min) + 4;
        const a = hue * Math.PI / 3;
        x += Math.cos(a) * sat; y += Math.sin(a) * sat; n++;
      }
      if (n < 20) return null;
      return Math.round((Math.atan2(y, x) * 180 / Math.PI + 360) % 360);
    } catch (e) {
      return null;
    }
  }
  function applyTint(card, hue) {
    if (hue === null || hue === undefined) return; // gris neutro por defecto
    card.style.setProperty('--tint-a', `hsl(${hue} 65% 91%)`);
    card.style.setProperty('--tint-b', `hsl(${hue} 70% 76%)`);
    card.style.setProperty('--tint-c', `hsl(${hue} 85% 58%)`);
  }

  // ---------- Render ----------
  function renderStats() {
    const counts = {
      all: flavors.length,
      fav: flavors.filter(FILTERS.fav.test).length,
      todo: flavors.filter(FILTERS.todo.test).length
    };
    statsEl.innerHTML = Object.keys(FILTERS).map(k =>
      `<button type="button" class="stat${k === 'fav' ? ' accent' : ''}" data-filter="${k}" aria-pressed="${filter === k}">` +
      `<span class="n">${counts[k]}</span><span class="lbl">${FILTERS[k].label}</span></button>`
    ).join('');
    statsEl.querySelectorAll('.stat').forEach(b =>
      b.addEventListener('click', () => setFilter(b.dataset.filter)));

    filterChip.hidden = filter === 'all';
    if (filter !== 'all') filterChipText.textContent = `${FILTERS[filter].chip} · ${counts[filter]}`;
  }

  function emptyState(iconName, title, text) {
    const e = document.createElement('div');
    e.className = 'empty';
    e.innerHTML = icon(iconName, 1.6) + `<div class="big">${title}</div><div>${text}</div>`;
    grid.appendChild(e);
  }

  function render() {
    renderStats();
    sortToggle.classList.toggle('active', sortByScore);
    sortToggle.setAttribute('aria-pressed', String(sortByScore));
    // Mantiene la altura mientras se rehace la rejilla para que la página no salte
    const keepY = window.scrollY;
    grid.style.minHeight = grid.offsetHeight + 'px';
    grid.innerHTML = '';
    try { renderCards(); } finally {
      grid.style.minHeight = '';
      if (Math.abs(window.scrollY - keepY) > 1) window.scrollTo(0, keepY);
    }
  }

  function renderCards() {

    if (flavors.length === 0) {
      emptyState('box', 'Aún no hay nada aquí', 'Añade tu primer sabor para empezar el registro.');
      return;
    }

    let list = sortByScore
      ? [...flavors].sort((a, b) => (hasScore(b) ? b.score : -1) - (hasScore(a) ? a.score : -1))
      : flavors;
    list = list.filter(FILTERS[filter].test);
    if (searchTerms.length) list = list.filter(f => { const n = norm(f.name); return searchTerms.every(t => n.includes(t)); });

    if (list.length === 0) {
      if (searchTerms.length) {
        emptyState('search', 'Sin resultados', `Ningún sabor coincide con «${escapeHtml(searchInput.value.trim())}».`);
      } else if (filter === 'fav') {
        emptyState('box', 'Sin favoritos todavía', 'Los sabores con un 8 o más aparecerán aquí.');
      } else {
        emptyState('box', '¡Todo probado!', 'No te queda ningún sabor sin puntuar.');
      }
      return;
    }

    const frag = document.createDocumentFragment();
    list.forEach((f, i) => {
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'card';
      card.style.animationDelay = Math.min(i, 12) * 25 + 'ms';
      const scored = hasScore(f);
      card.setAttribute('aria-label', `${f.name}, ${scored ? f.score + ' de 10' : 'sin puntuar'}. Editar`);

      const imgHtml = f.img
        ? `<img src="${escapeHtml(f.img)}" alt="" loading="lazy" decoding="async">`
        : `<span class="placeholder">${icon('image', 1.4)}</span>`;
      const badgeHtml = scored ? `<span class="score-badge ${tierOf(f.score)}" aria-hidden="true">${f.score}</span>` : '';

      card.innerHTML = `
        <span class="card-img">${badgeHtml}${imgHtml}</span>
        <span class="card-body">
          <span class="card-name">${escapeHtml(f.name)}</span>
          <span class="card-meta">
            <span class="line-tag"><i></i>${lineOf(f.name)}</span>
            ${scored ? '' : '<span class="todo">Por probar</span>'}
          </span>
        </span>`;

      const imgEl = card.querySelector('img');
      if (imgEl) {
        const key = f.id + ':' + f.img.length;
        const tint = () => {
          if (!tintCache.has(key)) tintCache.set(key, computeHue(imgEl));
          applyTint(card, tintCache.get(key));
        };
        if (imgEl.complete && imgEl.naturalWidth) tint();
        else imgEl.addEventListener('load', tint, { once: true });
        imgEl.addEventListener('error', () => {
          imgEl.outerHTML = `<span class="placeholder">${icon('image', 1.4)}</span>`;
        }, { once: true });
      }

      card.addEventListener('click', () => startEdit(f.id));
      frag.appendChild(card);
    });
    grid.appendChild(frag);
  }

  resetForm();
  grid.classList.add('intro'); // animación de entrada solo al abrir la app
  render();
  setTimeout(() => grid.classList.remove('intro'), 1000);
})();
</script>
</body>
</html>
