<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monster Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c08;
    --panel: #14180f;
    --panel-edge: #232a18;
    --acid: #95d600;
    --acid-dim: #6fa300;
    --ink: #eef2e6;
    --muted: #8a937a;
    --danger: #ff5a4d;
    --shadow: 0 12px 40px rgba(0,0,0,.55);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', sans-serif;
    background:
      radial-gradient(900px 500px at 80% -10%, rgba(149,214,0,.10), transparent 60%),
      radial-gradient(700px 400px at -10% 110%, rgba(149,214,0,.06), transparent 55%),
      var(--bg);
    color: var(--ink);
    min-height: 100vh;
    padding: 32px 20px 80px;
  }

  .wrap { max-width: 1100px; margin: 0 auto; }

  /* ---- Header ---- */
  header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--panel-edge);
    padding-bottom: 22px;
    margin-bottom: 36px;
  }

  .brand h1 {
    font-family: 'Anton', sans-serif;
    font-size: clamp(38px, 7vw, 72px);
    line-height: .92;
    letter-spacing: .5px;
    text-transform: uppercase;
  }
  .brand h1 .claw {
    color: var(--acid);
    text-shadow: 0 0 24px rgba(149,214,0,.45);
  }
  .brand p {
    color: var(--muted);
    margin-top: 8px;
    font-size: 14px;
    max-width: 38ch;
  }

  .count {
    text-align: right;
    flex-shrink: 0;
  }
  .count .n {
    font-family: 'Anton', sans-serif;
    font-size: 54px;
    color: var(--acid);
    line-height: 1;
  }
  .count .lbl {
    color: var(--muted);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  /* ---- Add button ---- */
  .add-btn {
    background: var(--acid);
    color: #0a0c08;
    border: none;
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 15px;
    padding: 14px 24px;
    border-radius: 10px;
    cursor: pointer;
    letter-spacing: .3px;
    transition: transform .12s ease, box-shadow .2s ease, background .2s ease;
    box-shadow: 0 0 0 rgba(149,214,0,0);
  }
  .add-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(149,214,0,.3); }
  .add-btn:active { transform: translateY(0); }
  .add-btn.open { background: var(--panel); color: var(--muted); box-shadow: none; }

  .toolbar { margin-bottom: 24px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

  .sort-btn {
    background: var(--panel);
    color: var(--muted);
    border: 1px solid var(--panel-edge);
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    padding: 13px 18px;
    border-radius: 10px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 9px;
    transition: color .15s ease, border-color .15s ease;
  }
  .sort-btn:hover { color: var(--ink); border-color: var(--muted); }
  .sort-btn .sort-dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--panel-edge);
    transition: background .15s ease, box-shadow .15s ease;
  }
  .sort-btn.active { color: var(--ink); border-color: var(--acid-dim); }
  .sort-btn.active .sort-dot {
    background: var(--acid);
    box-shadow: 0 0 10px rgba(149,214,0,.6);
  }

  /* ---- Form ---- */
  .form-panel {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 16px;
    padding: 0 26px;
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transition: max-height .35s ease, opacity .25s ease, padding .35s ease, margin .35s ease;
    margin-bottom: 0;
  }
  .form-panel.open {
    max-height: 520px;
    opacity: 1;
    padding: 26px;
    margin-bottom: 36px;
  }

  .form-title {
    font-family: 'Anton', sans-serif;
    font-size: 22px;
    letter-spacing: .5px;
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  .field-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
  }
  .field { display: flex; flex-direction: column; gap: 7px; }
  .field.full { grid-column: 1 / -1; }

  label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--muted);
    font-weight: 600;
  }

  input[type="text"], input[type="url"] {
    background: #0c0f08;
    border: 1px solid var(--panel-edge);
    border-radius: 9px;
    padding: 12px 14px;
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    transition: border-color .15s ease;
  }
  input[type="text"]:focus, input[type="url"]:focus {
    outline: none;
    border-color: var(--acid-dim);
  }

  /* ---- Rating picker ---- */
  .img-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .upload-btn {
    background: #0c0f08;
    border: 1px solid var(--panel-edge);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    padding: 12px 16px;
    border-radius: 9px;
    cursor: pointer;
    transition: border-color .15s ease;
    white-space: nowrap;
  }
  .upload-btn:hover { border-color: var(--acid-dim); }
  .img-or { color: var(--muted); font-size: 13px; }
  .img-controls input[type="url"] { flex: 1; min-width: 140px; }
  .clear-img {
    background: transparent;
    border: 1px solid var(--panel-edge);
    color: var(--muted);
    width: 38px; height: 38px;
    border-radius: 9px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .clear-img:hover { color: var(--danger); border-color: var(--danger); }
  .img-preview {
    margin-top: 14px;
    width: 120px;
    aspect-ratio: 1 / 1.15;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--panel-edge);
    background: #0c0f08;
  }
  .img-preview img { width: 100%; height: 100%; object-fit: cover; }

  .rating-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .rating-row .dot {
    width: 34px; height: 34px;
    border-radius: 8px;
    border: 1px solid var(--panel-edge);
    background: #0c0f08;
    color: var(--muted);
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: all .12s ease;
  }
  .rating-row .dot:hover { border-color: var(--acid-dim); color: var(--ink); }
  .rating-row .dot.active {
    background: var(--acid);
    color: #0a0c08;
    border-color: var(--acid);
  }

  .form-actions { display: flex; gap: 12px; margin-top: 24px; }
  .btn-primary {
    background: var(--acid);
    color: #0a0c08;
    border: none;
    font-weight: 700;
    font-size: 15px;
    padding: 12px 28px;
    border-radius: 9px;
    cursor: pointer;
    transition: transform .12s ease;
  }
  .btn-primary:hover { transform: translateY(-1px); }
  .btn-ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--panel-edge);
    font-weight: 600;
    font-size: 15px;
    padding: 12px 22px;
    border-radius: 9px;
    cursor: pointer;
  }
  .btn-ghost:hover { color: var(--ink); border-color: var(--muted); }

  /* ---- Grid ---- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: var(--shadow);
    transition: transform .15s ease, border-color .2s ease;
    position: relative;
  }
  .card:hover { transform: translateY(-4px); border-color: var(--acid-dim); }

  .card-img {
    aspect-ratio: 1 / 1.15;
    background: #0c0f08;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .card-img img { width: 100%; height: 100%; object-fit: cover; }
  .card-img .placeholder {
    font-family: 'Anton', sans-serif;
    font-size: 40px;
    color: var(--panel-edge);
  }

  .card-body { padding: 16px 16px 18px; }
  .card-name {
    font-weight: 700;
    font-size: 16px;
    line-height: 1.25;
    margin-bottom: 12px;
    min-height: 40px;
  }

  .score-pill {
    display: inline-flex;
    align-items: baseline;
    gap: 3px;
    background: rgba(149,214,0,.12);
    border: 1px solid rgba(149,214,0,.3);
    padding: 5px 12px;
    border-radius: 999px;
  }
  .score-pill .v {
    font-family: 'Anton', sans-serif;
    font-size: 22px;
    color: var(--acid);
    line-height: 1;
  }
  .score-pill .max { font-size: 12px; color: var(--muted); }

  .card-actions {
    position: absolute;
    top: 10px; right: 10px;
    display: flex;
    gap: 6px;
    opacity: 0;
    transition: opacity .15s ease;
  }
  .card:hover .card-actions { opacity: 1; }
  .icon-btn {
    width: 32px; height: 32px;
    border-radius: 8px;
    border: none;
    background: rgba(10,12,8,.85);
    backdrop-filter: blur(4px);
    color: var(--ink);
    cursor: pointer;
    font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s ease, color .15s ease;
  }
  .icon-btn:hover { background: var(--acid); color: #0a0c08; }
  .icon-btn.del:hover { background: var(--danger); color: #fff; }

  /* ---- Empty state ---- */
  .empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 80px 20px;
    border: 1px dashed var(--panel-edge);
    border-radius: 16px;
    color: var(--muted);
  }
  .empty .big {
    font-family: 'Anton', sans-serif;
    font-size: 28px;
    color: var(--ink);
    margin-bottom: 8px;
    text-transform: uppercase;
  }

  @media (max-width: 560px) {
    .field-grid { grid-template-columns: 1fr; }
    header { align-items: flex-start; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>MONSTER <span class="claw">VAULT</span></h1>
      <p>Tu registro personal de sabores. Puntúa lo que pruebas y consúltalo antes de entrar a la tienda.</p>
    </div>
    <div class="count">
      <div class="n" id="count">0</div>
      <div class="lbl">sabores</div>
    </div>
  </header>

  <div class="toolbar">
    <button class="add-btn" id="toggleForm">+ Añadir sabor</button>
    <button class="sort-btn" id="sortToggle">
      <span class="sort-dot"></span>
      Ordenar por puntuación
    </button>
  </div>

  <div class="form-panel" id="formPanel">
    <div class="form-title" id="formTitle">Nuevo sabor</div>
    <div class="field-grid">
      <div class="field full">
        <label for="fName">Nombre</label>
        <input type="text" id="fName" placeholder="Monster Ultra Paradise" autocomplete="off">
      </div>
      <div class="field full">
        <label>Imagen</label>
        <div class="img-controls">
          <button type="button" class="upload-btn" id="uploadBtn">📷 Subir foto</button>
          <input type="file" id="fFile" accept="image/*" hidden>
          <span class="img-or">o</span>
          <input type="url" id="fImg" placeholder="pegar URL…" autocomplete="off">
          <button type="button" class="clear-img" id="clearImg" hidden title="Quitar imagen">✕</button>
        </div>
        <div class="img-preview" id="imgPreview" hidden>
          <img id="imgPreviewImg" alt="Vista previa">
        </div>
      </div>
      <div class="field full">
        <label>Puntuación (0–10)</label>
        <div class="rating-row" id="ratingRow"></div>
      </div>
    </div>
    <div class="form-actions">
      <button class="btn-primary" id="saveBtn">Guardar</button>
      <button class="btn-ghost" id="cancelBtn">Cancelar</button>
    </div>
  </div>

  <div class="grid" id="grid"></div>
</div>

  ];

  // --- Estado ---
  let flavors = load();
  let editingId = null;
  let selectedScore = null;
  let sortByScore = localStorage.getItem(STORAGE_KEY + '-sort') === 'true';

  // --- Catálogo inicial ---
  // Añade los sabores del catálogo que aún no se hayan sembrado nunca. Cada slug
  // se marca como sembrado, así un sabor que borres no vuelve a aparecer.
  const SEEDED_KEY = STORAGE_KEY + '-seeded';
  (function seedCatalog() {
    let seeded;
    try { seeded = JSON.parse(localStorage.getItem(SEEDED_KEY) || '[]'); } catch (e) { seeded = []; }
    const existing = new Set(flavors.map(f => String(f.name).trim().toLowerCase()));
    const nuevos = [];
    const marcados = [...seeded];
    MONSTER_CATALOG.forEach(c => {
      if (seeded.includes(c.slug)) return;
      marcados.push(c.slug);
      if (existing.has(c.name.toLowerCase())) return; // ya lo tenías a mano
      nuevos.push({ id: 'seed-' + c.slug, name: c.name, img: c.img, score: null });
    });
    if (marcados.length === seeded.length) return;
    const antes = flavors;
    flavors = flavors.concat(nuevos);
    try {
      save();
      localStorage.setItem(SEEDED_KEY, JSON.stringify(marcados));
    } catch (e) {
      flavors = antes; // sin espacio: no siembra y lo reintenta la próxima vez
    }
  })();

  // --- Elementos ---
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  const formPanel = document.getElementById('formPanel');
  const toggleBtn = document.getElementById('toggleForm');
  const sortToggle = document.getElementById('sortToggle');
  const formTitle = document.getElementById('formTitle');
  const nameInput = document.getElementById('fName');
  const imgInput = document.getElementById('fImg');
  const fileInput = document.getElementById('fFile');
  const uploadBtn = document.getElementById('uploadBtn');
  const clearImgBtn = document.getElementById('clearImg');
  const imgPreview = document.getElementById('imgPreview');
  const imgPreviewImg = document.getElementById('imgPreviewImg');
  const ratingRow = document.getElementById('ratingRow');

  // Imagen actual del formulario (base64 de archivo subido o URL pegada)
  let currentImg = '';
  const saveBtn = document.getElementById('saveBtn');
  const cancelBtn = document.getElementById('cancelBtn');

  // --- Construir selector de puntuación ---
  for (let i = 0; i <= 10; i++) {
    const dot = document.createElement('button');
    dot.className = 'dot';
    dot.type = 'button';
    dot.textContent = i;
    dot.addEventListener('click', () => {
      selectedScore = i;
      [...ratingRow.children].forEach(d => d.classList.remove('active'));
      dot.classList.add('active');
    });
    ratingRow.appendChild(dot);
  }

  // --- Imagen: subir archivo, pegar URL, vista previa ---
  function setPreview(src) {
    currentImg = src || '';
    if (currentImg) {
      imgPreviewImg.src = currentImg;
      imgPreview.hidden = false;
      clearImgBtn.hidden = false;
    } else {
      imgPreview.hidden = true;
      clearImgBtn.hidden = true;
      imgPreviewImg.removeAttribute('src');
    }
  }

  // Redimensiona la imagen a máx. 400px de ancho y la devuelve como base64
  // (JPEG calidad 0.8). Así ocupa poco y no revienta localStorage.
  function resizeImage(file, maxW, cb) {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        cb(canvas.toDataURL('image/jpeg', 0.8));
      };
      img.onerror = () => cb('');
      img.src = e.target.result;
    };
    reader.onerror = () => cb('');
    reader.readAsDataURL(file);
  }

  uploadBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if (!file) return;
    resizeImage(file, 400, dataUrl => {
      setPreview(dataUrl);
      imgInput.value = ''; // la foto subida tiene prioridad sobre la URL
    });
  });
  imgInput.addEventListener('input', () => {
    if (imgInput.value.trim()) setPreview(imgInput.value.trim());
    else if (!fileInput.files.length) setPreview('');
  });
  clearImgBtn.addEventListener('click', () => {
    setPreview('');
    imgInput.value = '';
    fileInput.value = '';
  });

  // --- Persistencia ---
  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }
  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(flavors));
  }

  // --- Formulario ---
  function openForm(edit) {
    formPanel.classList.add('open');
    toggleBtn.classList.add('open');
    toggleBtn.textContent = '× Cerrar';
    if (!edit) nameInput.focus();
  }
  function closeForm() {
    formPanel.classList.remove('open');
    toggleBtn.classList.remove('open');
    toggleBtn.textContent = '+ Añadir sabor';
    resetForm();
  }
  function resetForm() {
    editingId = null;
    selectedScore = null;
    nameInput.value = '';
    imgInput.value = '';
    fileInput.value = '';
    setPreview('');
    formTitle.textContent = 'Nuevo sabor';
    saveBtn.textContent = 'Guardar';
    [...ratingRow.children].forEach(d => d.classList.remove('active'));
  }

  toggleBtn.addEventListener('click', () => {
    if (formPanel.classList.contains('open')) closeForm();
    else openForm(false);
  });
  cancelBtn.addEventListener('click', closeForm);

  // --- Toggle de ordenamiento ---
  sortToggle.addEventListener('click', () => {
    sortByScore = !sortByScore;
    localStorage.setItem(STORAGE_KEY + '-sort', sortByScore);
    render();
  });

  // --- Guardar (crear o editar) ---
  saveBtn.addEventListener('click', () => {
    const name = nameInput.value.trim();
    if (!name) { nameInput.focus(); return; }
    const data = {
      name,
      img: currentImg,
      score: selectedScore
    };

    const snapshot = JSON.stringify(flavors);
    if (editingId) {
      const idx = flavors.findIndex(f => f.id === editingId);
      if (idx !== -1) flavors[idx] = { ...flavors[idx], ...data };
    } else {
      flavors.unshift({ id: Date.now().toString(36), ...data });
    }

    try {
      save();
    } catch (e) {
      // localStorage lleno (demasiadas imágenes pesadas): revertimos y avisamos
      flavors = JSON.parse(snapshot);
      alert('No se pudo guardar: el almacenamiento está lleno. Prueba con una imagen más ligera o borra algún sabor.');
      return;
    }
    render();
    closeForm();
  });

  // --- Editar ---
  function startEdit(id) {
    const f = flavors.find(x => x.id === id);
    if (!f) return;
    editingId = id;
    nameInput.value = f.name;
    // Si la imagen guardada es una URL la mostramos en el campo; si es una foto
    // subida (base64) solo la cargamos en la vista previa.
    imgInput.value = (f.img && !f.img.startsWith('data:')) ? f.img : '';
    fileInput.value = '';
    setPreview(f.img || '');
    selectedScore = f.score;
    [...ratingRow.children].forEach(d =>
      d.classList.toggle('active', Number(d.textContent) === f.score));
    formTitle.textContent = 'Editar sabor';
    saveBtn.textContent = 'Actualizar';
    openForm(true);
    formPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  // --- Borrar ---
  function remove(id) {
    flavors = flavors.filter(f => f.id !== id);
    save();
    render();
  }

  // --- Render ---
  function render() {
    countEl.textContent = flavors.length;
    grid.innerHTML = '';

    sortToggle.classList.toggle('active', sortByScore);

    if (flavors.length === 0) {
      const e = document.createElement('div');
      e.className = 'empty';
      e.innerHTML = '<div class="big">Aún no hay nada aquí</div>' +
        '<div>Añade tu primer sabor para empezar el registro.</div>';
      grid.appendChild(e);
      return;
    }

    // Lista a mostrar: ordenada por puntuación si el filtro está activo,
    // si no, en el orden original de inserción.
    const list = sortByScore
      ? [...flavors].sort((a, b) => (b.score ?? -1) - (a.score ?? -1))
      : flavors;

    list.forEach(f => {
      const card = document.createElement('div');
      card.className = 'card';

      const imgHtml = f.img
        ? `<img src="${escapeAttr(f.img)}" alt="${escapeAttr(f.name)}" onerror="this.parentElement.innerHTML='<span class=&quot;placeholder&quot;>M</span>'">`
        : '<span class="placeholder">M</span>';

      const scoreHtml = (f.score !== null && f.score !== undefined)
        ? `<div class="score-pill"><span class="v">${f.score}</span><span class="max">/10</span></div>`
        : '<div class="score-pill"><span class="max">sin puntuar</span></div>';

      card.innerHTML = `
        <div class="card-actions">
          <button class="icon-btn edit" title="Editar">✎</button>
          <button class="icon-btn del" title="Borrar">✕</button>
        </div>
        <div class="card-img">${imgHtml}</div>
        <div class="card-body">
          <div class="card-name">${escapeHtml(f.name)}</div>
          ${scoreHtml}
        </div>`;

      card.querySelector('.edit').addEventListener('click', () => startEdit(f.id));
      card.querySelector('.del').addEventListener('click', () => remove(f.id));
      grid.appendChild(card);
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c =>
      ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }
  function escapeAttr(s) { return escapeHtml(s); }

  render();
})();
</script>
</body>
</html>
